<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Email Automation Pro</title>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6"><h1 class="text-3xl font-black text-gray-900">Email Automation Pro</h1></header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-3xl border shadow-sm">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">Compose New Email</h2>
                    <form id="emailForm" method="POST" enctype="multipart/form-data" class="space-y-3">
                        {% csrf_token %}
                        <input type="text" name="subject" placeholder="Subject Line" class="w-full p-3 border rounded-xl text-sm" required>
                        <textarea name="body" placeholder="Write your email content here..." class="w-full p-3 border rounded-xl h-32 text-sm"></textarea>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase">Single Recipient</label>
                                <input type="email" name="manual_email" placeholder="Email Address" class="border p-3 w-full rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-500 uppercase">Bulk CSV (Header must be 'email')</label>
                                <input type="file" name="csv_file" accept=".csv" class="border p-2 w-full rounded-xl bg-gray-50 text-xs">
                            </div>
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Attachment (Optional)</label>
                            <input type="file" name="attachment" class="border p-2 w-full rounded-xl bg-gray-50 text-xs">
                        </div>

                        <button type="submit" id="sendBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Send Email</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-3xl border shadow-sm">
                    <h3 class="font-bold text-lg mb-4">Recent Activity</h3>
                    <div class="overflow-y-auto max-h-64 border rounded-2xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-gray-50 sticky top-0">
                                <tr class="text-gray-400 uppercase text-[10px]">
                                    <th class="p-3">Email</th><th class="p-3">Status</th><th class="p-3">Mark</th><th class="p-3">Delivery</th><th class="p-3">Date</th>
                                </tr>
                            </thead>
                            <tbody id="log-table" class="text-gray-600 divide-y">
                                <tr><td colspan="5" class="p-4 text-center">Loading activity...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-blue-600 p-6 rounded-3xl text-white shadow-lg">
                    <p class="text-blue-100 text-xs">Total Sent</p>
                    <h2 class="text-4xl font-black" id="total">0</h2>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-4 rounded-2xl border text-center"><p class="text-[9px] uppercase font-bold text-gray-400">Inbox</p><h2 class="text-lg font-black text-green-600" id="inbox">0</h2></div>
                    <div class="bg-white p-4 rounded-2xl border text-center"><p class="text-[9px] uppercase font-bold text-gray-400">Spam</p><h2 class="text-lg font-black text-red-500" id="spam">0</h2></div>
                </div>
                <div class="bg-white p-5 rounded-3xl border text-center">
                    <p class="text-gray-400 text-[9px] uppercase font-bold">Read / Unread</p>
                    <h2 class="text-2xl font-black text-purple-600"><span id="read">0</span> / <span id="unread">0</span></h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-5 rounded-3xl border">
                        <h3 class="font-bold text-gray-800 mb-2 text-xs uppercase">Filter by Date</h3>
                        <input type="date" id="dateFilter" class="w-full p-2 border rounded-xl text-sm mb-2">
                        <button onclick="applyDateFilter()" class="w-full bg-gray-800 text-white font-bold py-2 rounded-xl text-sm hover:bg-black transition">
                            Go
                        </button>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border">
                        <h3 class="font-bold text-gray-800 mb-2 text-xs uppercase">Emails by Date</h3>
                        <div id="date-stats-container" class="space-y-2 text-[11px]"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isFiltered = false;

        document.addEventListener('DOMContentLoaded', () => {
            loadStats(true);
        });

        function generateTableRow(log) {
            const isRead = log.mark === 'Read';
            return `
                <tr class="border-b">
                    <td class="p-3 truncate max-w-[120px]">${log.email_address}</td>
                    <td class="p-3">${log.status}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded-full text-[9px] font-bold ${isRead ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${log.mark}
                        </span>
                    </td>
                    <td class="p-3">${log.deliverability}</td>
                    <td class="p-3 text-gray-400">${log.date_sent}</td>
                </tr>
            `;
        }

        function applyDateFilter() {
            const date = document.getElementById('dateFilter').value;
            if (date) {
                loadFiltered(date);
            } else {
                alert("Please select a date first!");
            }
        }

        async function loadStats(force = false) {
            if (isFiltered && !force) return;
            try {
                const res = await fetch('/api/stats/');
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                updateUI(data);

                if (data.date_stats) {
                    let html = `<div onclick="resetView()" class="text-blue-600 font-bold cursor-pointer hover:underline mb-2">Show All</div>`;
                    data.date_stats.forEach(ds => {
                        html += `<div class="flex justify-between border-b py-1 cursor-pointer hover:bg-gray-50" onclick="loadFiltered('${ds.date}')"><span>${ds.date}</span><span class="font-bold">${ds.count}</span></div>`;
                    });
                    document.getElementById('date-stats-container').innerHTML = html;
                }
            } catch (err) { console.error(err); }
        }

        async function loadFiltered(date) {
            if (!date) return;
            isFiltered = true;
            try {
                const res = await fetch(`/api/filtered-logs/?date=${date}`);
                const data = await res.json();
                updateUI(data);
            } catch (err) { console.error(err); }
        }

        function updateUI(data) {
            if (data.stats) {
                document.getElementById('total').innerText = data.stats.total_sent || 0;
                document.getElementById('inbox').innerText = data.stats.inbox_count || 0;
                document.getElementById('spam').innerText = data.stats.spam_count || 0;
                document.getElementById('read').innerText = data.stats.read_count || 0;
                document.getElementById('unread').innerText = data.stats.unread_count || 0;
            } else {
                document.getElementById('total').innerText = data.total_sent || 0;
                document.getElementById('inbox').innerText = data.inbox_count || 0;
                document.getElementById('spam').innerText = data.spam_count || 0;
                document.getElementById('read').innerText = data.read_count || 0;
                document.getElementById('unread').innerText = data.unread_count || 0;
            }

            const tableBody = document.getElementById('log-table');
            if (data.logs && data.logs.length > 0) {
                tableBody.innerHTML = data.logs.map(log => generateTableRow(log)).join('');
            } else {
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No activity found.</td></tr>`;
            }
        }

        function resetView() {
            isFiltered = false;
            document.getElementById('dateFilter').value = '';
            loadStats(true);
        }

        document.getElementById('emailForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.innerText = "Sending...";
            const formData = new FormData(e.target);
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            try {
                await fetch('/send-bulk-email/', { method: 'POST', body: formData, headers: {'X-CSRFToken': csrftoken} });
                alert("Campaign started!");
                e.target.reset();
                loadStats(true);
            } catch (err) { alert("Error sending email"); }
            btn.innerText = "Send Email";
        };

        setInterval(() => { if (!isFiltered) loadStats(); }, 5000);
    </script>
</body>
</html>
