<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Email Automation Pro</title>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6">
            <h1 class="text-3xl font-black text-gray-900">Email Automation Pro</h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-3xl border shadow-sm">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">Compose New Email</h2>
                    <form id="emailForm" method="POST" enctype="multipart/form-data" class="space-y-3">
                        {% csrf_token %}
                        <input type="text" name="subject" placeholder="Subject Line" class="w-full p-3 border rounded-xl text-sm" required>
                        <textarea name="body" placeholder="Write your email content here..." class="w-full p-3 border rounded-xl h-32 text-sm"></textarea>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="email" name="manual_email" placeholder="Recipient Email" class="border p-3 w-full rounded-xl text-sm">
                            <input type="file" name="csv_file" accept=".csv" class="border p-2.5 w-full rounded-xl bg-gray-50 text-xs">
                        </div>
                        <button type="submit" id="sendBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Send Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('emailForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('sendBtn');
            btn.innerText = "Sending...";

            const formData = new FormData(e.target);
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            try {
                const response = await fetch('/send-bulk-email/', {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-CSRFToken': csrftoken }
                });

                if (response.ok) {
                    alert("Campaign started successfully!");
                    e.target.reset();
                } else {
                    alert("Error: Something went wrong.");
                }
            } catch (err) {
                console.error(err);
            }
            btn.innerText = "Send Email";
        };
    </script>
</body>
</html>
